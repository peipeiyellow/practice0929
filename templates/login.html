<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員登入 - SQLite 訂單系統</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --slate-900: #0f172a;
            --slate-700: #334155;
            --slate-500: #64748b;
            --slate-200: #e2e8f0;
            --slate-100: #f1f5f9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 16px;
            padding: 36px 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.2), 0 8px 10px -6px rgb(0 0 0 / 0.2);
            position: relative;
        }
        .login-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, #4f46e5, #06b6d4);
            border-radius: 16px 16px 0 0;
        }
        h2 { font-size: 1.6rem; color: var(--slate-900); margin-bottom: 8px; text-align: center; }
        .sub { color: var(--slate-500); font-size: 0.9rem; text-align: center; margin-bottom: 24px; }
        .alert-error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 18px;
        }
        .form-group { margin-bottom: 18px; text-align: left; }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--slate-700); margin-bottom: 6px; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--slate-200);
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn-submit:hover { background: var(--primary-dark); }
        .hint-box {
            margin-top: 24px;
            padding: 12px;
            background: var(--slate-100);
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--slate-700);
            line-height: 1.5;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: var(--slate-500);
            text-decoration: none;
            font-size: 0.85rem;
        }
        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>管理員登入</h2>
        <p class="sub">登入後即可維護客戶、商品及建立新訂單</p>

        {% if error %}
        <div class="alert-error">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">管理員帳號 (Username)</label>
                <input type="text" id="username" name="username" value="admin" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">登入密碼 (Password)</label>
                <input type="password" id="password" name="password" value="admin123" required>
            </div>
            <button type="submit" class="btn-submit">立即登入</button>
        </form>

        <div class="hint-box">
            🔑 <strong>預設管理員測試帳號：</strong><br>
            • 帳號：<code>admin</code><br>
            • 密碼：<code>admin123</code>
        </div>

        <a href="/" class="back-link">← 返回首頁總覽</a>
    </div>
</body>
</html>
